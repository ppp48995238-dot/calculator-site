<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mortgage Calculator</title>
<meta name="description" content="Calculate home loan monthly payments and total interest.">

</head>

<body style="font-family:Arial;max-width:800px;margin:auto;padding:20px;">

<h1>Mortgage Calculator</h1>

<p>Estimate your monthly mortgage payments and total loan cost.</p>

<hr>

<input id="amount" placeholder="Loan Amount"><br><br>
<input id="rate" placeholder="Interest Rate"><br><br>
<input id="years" placeholder="Years"><br><br>

<button onclick="calc()">Calculate</button>

<h2 id="result"></h2>

<script>
function calc() {
  let p = parseFloat(document.getElementById("amount").value);
  let r = parseFloat(document.getElementById("rate").value) / 100 / 12;
  let n = parseFloat(document.getElementById("years").value) * 12;

  let x = Math.pow(1 + r, n);
  let monthly = (p * x * r) / (x - 1);

  document.getElementById("result").innerText =
    "Monthly Payment: " + monthly.toFixed(0);
}
</script>

</body>
</html>
